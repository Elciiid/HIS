[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrointel"
version = "0.1.0"
description = "Hydrointelligence System, Part A: coupled 1-D/2-D flood physics engine and GeoKAN-PINO surrogate"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
extras = ["scipy>=1.11", "networkx>=3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hydrointel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (full benchmark resolutions)"]
